# Per-address limit for sign-in style endpoints (see app-locations.inc).
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host__PORT_SUFFIX__$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /opt/redshadow/nginx/security-headers.inc;
    include /opt/redshadow/nginx/app-locations.inc;
}
