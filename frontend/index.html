<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1f3038" />
    <title>RedShadow</title>
    <style>
      /* Shown until the app mounts. Same eclipse O as the in-app loader (src/design/Loader.tsx). */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f9fa; color: #1f3038; }
      .boot rect { fill: none; stroke-width: 17; }
      .boot .t { stroke: currentColor; opacity: .14; }
      .boot .a { stroke: #e5383b; stroke-dasharray: 30 70; animation: o 1.5s linear infinite; }
      .boot .w { fill: #e5383b; transform-box: fill-box; transform-origin: 100% 100%; animation: b 1.5s ease-in-out infinite; }
      @keyframes o { to { stroke-dashoffset: -100; } }
      @keyframes b { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot .a, .boot .w { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><svg viewBox="0 0 84 100" width="53" height="64" aria-hidden="true"><rect class="t" x="10" y="8.5" width="64" height="83" rx="17"/><rect class="a" x="10" y="8.5" width="64" height="83" rx="17" pathLength="100"/><path class="w" d="M60 32V77C60 78.1 59.1 79 58 79H26C24.9 79 24 78.1 24 77V68Z"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
